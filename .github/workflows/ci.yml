name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  composer-validate:
    name: Composer validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  coding-standards:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.dependency-versions }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        symfony:
          - '5.4.*' # LTS
          - '6.4.*'
          - '7.4.*'
          - '8.0.*'
        dependency-versions:
          - highest
        exclude:
          # requires PHP >=8.2
          - php: '8.1'
            symfony: '7.4.*'
          # requires PHP >=8.4
          - php: '8.1'
            symfony: '8.0.*'
          - php: '8.2'
            symfony: '8.0.*'
          - php: '8.3'
            symfony: '8.0.*'
        include:
          # single extra run pinned to the lowest PHP/Symfony we can still resolve with Composer's security-advisory policy
          - os: ubuntu-latest
            php: '8.1'
            symfony: '5.4.*'
            dependency-versions: lowest

    runs-on: ${{ matrix.os }}

    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: date.timezone='UTC'
          tools: composer:v2,flex

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Install PHPUnit
        run: vendor/bin/simple-phpunit install

      - name: Test
        run: vendor/bin/simple-phpunit --coverage-text --verbose
